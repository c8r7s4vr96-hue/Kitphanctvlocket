prev.addEventListener('click',()=>updateContent(currentIndex-1));next.addEventListener('click',()=>updateContent(currentIndex+1));select.addEventListener('change',()=>{updateContent(Number(select.value));document.getElementById('step-badge').scrollIntoView({block:'start'});});
document.getElementById('image-button').addEventListener('click',()=>{document.getElementById('zoom-image').src=image.src;document.getElementById('zoom-image').alt=image.alt;dialog.showModal()});document.getElementById('close-zoom').addEventListener('click',()=>dialog.close());dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()});document.addEventListener('keydown',e=>{if(dialog.open||/SELECT|INPUT|TEXTAREA/.test(e.target.tagName)||e.altKey||e.ctrlKey||e.metaKey)return;if(e.key==='ArrowRight'){e.preventDefault();updateContent(currentIndex+1)}if(e.key==='ArrowLeft'){e.preventDefault();updateContent(currentIndex-1)}});updateContent(0);
</script></body></html>
